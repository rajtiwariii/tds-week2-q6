version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis_backend
    restart: always

  api:
    build: .
    container_name: fastapi_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis